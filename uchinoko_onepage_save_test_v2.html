<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>うちの子ノート・保存テスト v2</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f4f6f2;color:#234332;padding:20px 14px;margin:0}main{max-width:650px;margin:auto}a.action{display:block;background:#286849;color:white;text-align:center;padding:17px;margin:12px 0;border-radius:10px;font-weight:bold;text-decoration:none}a.alt{background:#3b5e83}.note{background:#fff;padding:15px;border-radius:10px;line-height:1.7}img{width:100%;height:auto;border:1px solid #ddd}small{color:#555;line-height:1.7;display:block}</style></head><body><main><h2>🐾 A4書類・保存テスト v2</h2><div class="note">今回は大容量データをHTMLに埋め込まず、画像とPDFを別ファイルとして開きます。<strong>GitHubにHTML・PNG・PDFの3ファイルを同じ場所へアップロードしてください。</strong></div><a class="action" href="uchinoko_onepage_sample.png" target="_blank" rel="noopener">PNG画像を開く</a><a class="action alt" href="uchinoko_onepage_sample.pdf" target="_blank" rel="noopener">A4 PDFを開く</a><small>画像：開いた画像を長押しして「写真に保存」等を選択。PDF：開いたPDFの共有メニューから「ファイルに保存」を選択。ブラウザによって表示が異なります。</small><h3>サンプル画像</h3><img src="uchinoko_onepage_sample.png" alt="毎日のお世話ノートのサンプル"><small>これは保存方法のみの確認用で、入力データとの連動はありません。</small></main></body></html>
